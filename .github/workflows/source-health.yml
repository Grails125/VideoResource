name: Source health

on:
  schedule:
    - cron: '17 22 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-health-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      YINGCHUAN_NATIVE_CORE_REVISION: 3b1d9b0e2e096203cba6156b3aee241033ca4823
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Validate current JSON inventory
        id: inventory
        run: python -B scripts/check_subscriptions.py --github-output "$GITHUB_OUTPUT"
      - name: Restore fixed FFmpeg package
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/yingchuan-ffmpeg/*.whl
          key: ffmpeg-linux-x64-050d6850601c3b3890bd2b28306f3b842b3daea390a561101174375a1c460bda
      - name: Prepare media decoder
        timeout-minutes: 5
        run: python -B scripts/setup_ffmpeg.py
      - name: Prepare Go for native protocols
        if: steps.inventory.outputs.native == 'true'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.24.1'
          cache: false
      - name: Restore public Go module dependencies
        if: steps.inventory.outputs.native == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/go/pkg/mod
          key: native-health-public-modules-linux-go1.24.1-${{ env.YINGCHUAN_NATIVE_CORE_REVISION }}
      - name: Build and verify native protocol runner
        if: steps.inventory.outputs.native == 'true'
        timeout-minutes: 10
        env:
          CGO_ENABLED: '0'
          GOTOOLCHAIN: local
          YINGCHUAN_HEALTH_SUBSCRIPTIONS: ${{ github.workspace }}/subscriptions
        run: |
          client="$RUNNER_TEMP/yingchuan-health-client"
          git init "$client"
          git -C "$client" remote add origin https://github.com/yingchuan-media/yingchuan.git
          git -C "$client" fetch --depth=1 --filter=blob:none origin "$YINGCHUAN_NATIVE_CORE_REVISION"
          git -C "$client" sparse-checkout init --cone
          git -C "$client" sparse-checkout set native
          git -C "$client" checkout --detach FETCH_HEAD
          test "$(git -C "$client" rev-parse HEAD)" = "$YINGCHUAN_NATIVE_CORE_REVISION"
          cp scripts/native_probe_test.go "$client/native/core/repository_health_ci_test.go"
          native_runner="$RUNNER_TEMP/yingchuan-native-health"
          cd "$client/native"
          go test -mod=readonly -c -o "$native_runner" ./core
          go mod verify
          "$native_runner" -test.run='^TestRepositoryHealth' -test.timeout=90s
          echo "YINGCHUAN_NATIVE_PROBE=$native_runner" >> "$GITHUB_ENV"
      - name: Validate subscriptions and run synthetic tests
        run: |
          python -B scripts/check_subscriptions.py
          python -B -m unittest discover -s scripts -p 'test_*.py'
      - name: Check sources and update report
        run: python -B scripts/check_health.py --summary "$GITHUB_STEP_SUMMARY"
      - name: Confirm subscriptions remain unchanged
        run: git diff --exit-code -- subscriptions
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-health-readme
          path: README.md
          if-no-files-found: error
          retention-days: 7

  update-readme:
    needs: probe
    if: github.repository == 'yingchuan-media/yingchuan-sources' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: source-health-readme
          path: ${{ runner.temp }}/source-health
      - name: Commit only the README report
        env:
          REPORT_PATH: ${{ runner.temp }}/source-health/README.md
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          cp -- "$REPORT_PATH" README.md
          git add -- README.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c core.hooksPath=/dev/null commit -m 'chore: update daily source health report'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
